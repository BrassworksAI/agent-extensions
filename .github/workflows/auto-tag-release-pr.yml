name: Auto Tag Release PR

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-release:
    if: >-
      ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && (contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease:') || startsWith(github.event.pull_request.title, 'chore(main): release')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require tag push token
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -n "$RELEASE_TAG_TOKEN" ]; then
            exit 0
          fi
          echo "Error: Missing RELEASE_TAG_TOKEN secret"
          echo "Add a fine-grained PAT or GitHub App token with Contents: Read and write access."
          exit 1

      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TAG_TOKEN }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create and push version tag
        run: |
          VERSION=$(node -p "require('./npm/package.json').version")
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TAG already exists"
            echo "Auto-tag reruns do not retrigger release for existing tags."
            echo "Delete and re-push the tag to trigger the Release workflow."
            exit 1
          fi

          git tag "$TAG"
          git push origin "$TAG"

      - name: Mark release PR as tagged
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_TAG_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: 'autorelease: pending',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ['autorelease: tagged'],
            });
